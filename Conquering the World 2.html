<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conquering the World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap">
<style>
:root{--bg:#f4f6f8;--fg:#14202b;--card:#fff;--sea:#14679b;--land:#e3dcc8;--ac:#0a7d3b;--bd:#c9d2da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8eef3;--card:#18232e;--sea:#12324a;--land:#2a3a33;--ac:#2ecc71;--bd:#2c3b49;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8eef3;--card:#18232e;--sea:#12324a;--land:#2a3a33;--ac:#2ecc71;--bd:#2c3b49;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
.c{margin:auto;text-align:center;padding:20px;max-width:340px;width:100%}
h1{font-size:30px;margin:0 0 6px}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;margin:6px 0;cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0;font-weight:700}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:6px;padding:6px 8px;align-items:center}
.bar button{width:auto;margin:0;padding:8px 8px;font-size:12px}
.bar b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar select{width:84px;max-width:26vw;margin:0;padding:8px 4px;font-size:12px}
#map{flex:1;min-height:0;width:100%;touch-action:none;position:relative}
#map text{pointer-events:none;fill:#fff;font-weight:700;text-anchor:middle;stroke:#000;stroke-width:.35;paint-order:stroke}
#map text.fg{stroke:none;font-weight:400}
.land{fill:none;stroke:rgba(0,0,0,.45);stroke-width:.3}
#pn{padding:8px 10px 10px;background:var(--card);border-top:1px solid var(--bd)}
#pn .r{display:flex;gap:6px}#pn .r>*{margin:3px 0}
#log{font-size:13px;min-height:38px;max-height:84px;overflow:auto;padding:4px 2px}
#arr{font-size:26px;width:44px;text-align:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
#ov.on{display:block}
#bx{position:absolute;inset:8% 4%;background:var(--card);border-radius:14px;padding:12px;overflow:auto;border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--bd);font-size:14px}
.tag{display:inline-block;width:30px;opacity:.6;font-size:12px}
h3{margin:10px 0 4px;font-size:14px}
.zb{display:none}
.zb button{width:36px;padding:6px;margin:2px 0}
